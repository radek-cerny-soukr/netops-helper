name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.14

      - name: Install locked runtime and test tools
        run: python -m pip install --require-hashes -r requirements-release.lock

      - name: Run offline verification
        run: |
          python -m pytest -q
          PYTHONPATH=src python tests/run_tests.py
          python scripts/generate_sbom.py
          git diff --exit-code -- sbom.cdx.json
          python scripts/check_public_release.py
          python scripts/create_release_artifacts.py --output dist
