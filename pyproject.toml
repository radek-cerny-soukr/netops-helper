[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netops-helper"
version = "0.2.0"
description = "Read-only MCP engine for bounded network troubleshooting"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.0.3",
  "mcp==2.1.1",
  "httpx==0.28.1",
  "netmiko==4.7.0",
  "pysnmp==7.1.29",
  "icmplib==3.0.4",
  "asyncssh==2.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
